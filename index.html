<!DOCTYPE html>

<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="時間割">

```
body {
  font-family: 'Hiragino Sans', 'Noto Sans JP', sans-serif;
  background: #f7f8fc;
  min-height: 100vh;
  padding: 24px 12px;
  -webkit-tap-highlight-color: transparent;
}

h1 {
  text-align: center;
  font-size: 20px;
  font-weight: 700;
  color: #2a2a3a;
  margin-bottom: 6px;
  letter-spacing: 0.05em;
}

.subtitle {
  text-align: center;
  font-size: 12px;
  color: #888;
  margin-bottom: 20px;
}

.card {
  max-width: 680px;
  margin: 0 auto;
  background: #fff;
  border-radius: 20px;
  box-shadow: 0 4px 24px rgba(0,0,0,0.08);
  padding: 14px;
}

.grid-row {
  display: grid;
  grid-template-columns: 28px repeat(5, 1fr);
  gap: 5px;
  margin-bottom: 5px;
}

.day-header {
  text-align: center;
  font-weight: 700;
  font-size: 14px;
  color: #2a2a3a;
  border-radius: 10px;
  padding: 6px 0;
}
.day-header.today {
  background: #d4a820;
  color: #fff;
}

.period-label {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
.period-num {
  font-size: 13px;
  font-weight: 700;
  color: #2a2a3a;
  line-height: 1;
}
.period-time {
  font-size: 7.5px;
  color: #aaa;
  margin-top: 2px;
  text-align: center;
  line-height: 1.3;
  white-space: pre-line;
}

.cell {
  border-radius: 12px;
  min-height: 86px;
  padding: 9px 7px;
  display: flex;
  align-items: flex-start;
  cursor: pointer;
  transition: transform 0.12s;
  box-shadow: 0 2px 8px rgba(0,0,0,0.06);
}
.cell:active { transform: scale(0.96); }
.cell.empty {
  background: #f7f8fc;
  box-shadow: none;
  cursor: default;
}
.cell-name {
  font-size: 11px;
  font-weight: 600;
  line-height: 1.45;
}

/* Colors */
.beige { background: #f5f0e8; } .beige .cell-name { color: #5a4a3a; }
.yellow { background: #fef9e0; } .yellow .cell-name { color: #5a4a10; }
.blue   { background: #e8f0fa; } .blue .cell-name   { color: #1a3a6a; }
.pink   { background: #fde8ec; } .pink .cell-name   { color: #6a1a2a; }
.green  { background: #e8f5ea; } .green .cell-name  { color: #1a4a2a; }

/* Modal */
.overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.32);
  align-items: center;
  justify-content: center;
  z-index: 100;
}
.overlay.active { display: flex; }

.modal {
  background: #fff;
  border-radius: 20px;
  padding: 28px 24px;
  max-width: 320px;
  width: 88%;
  box-shadow: 0 8px 40px rgba(0,0,0,0.18);
}
.modal-meta {
  font-size: 11px;
  color: #888;
  font-weight: 600;
  margin-bottom: 10px;
}
.modal-name {
  font-size: 17px;
  font-weight: 700;
  color: #1a1a2e;
  line-height: 1.5;
  margin-bottom: 16px;
}
.modal-room-label {
  font-size: 11px;
  color: #aaa;
  font-weight: 600;
  margin-bottom: 6px;
}
.modal-room {
  font-size: 32px;
  font-weight: 800;
  color: #2a2a3a;
  letter-spacing: 0.04em;
  margin-bottom: 24px;
}
.modal-close {
  width: 100%;
  padding: 12px;
  border-radius: 12px;
  border: none;
  background: #2a2a3a;
  color: #fff;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
}

<body>

<h1>時間割</h1>
<p class="subtitle">日吉キャンパス</p>

<div class="card" id="timetable"></div>

<!-- Modal -->

<div class="overlay" id="overlay" onclick="closeModal()">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-meta" id="modal-meta"></div>
    <div class="modal-name" id="modal-name"></div>
    <div class="modal-room-label">教室</div>
    <div class="modal-room" id="modal-room"></div>
    <button class="modal-close" onclick="closeModal()">閉じる</button>
  </div>
</div>

<script>
const data = {
  1: {
    月: { name: "経営学基礎", room: "J19", color: "beige" },
    火: { name: "総合教育セミナーDa（Ⅰ類）", room: "224", color: "yellow" },
    水: { name: "英語コミュニケーションⅠa（準上級）", room: "311", color: "blue" },
    木: { name: "英語スピーチとディベート（Ⅰ）", room: "327", color: "beige" },
    金: { name: "中国語Ⅱa", room: "333", color: "pink" },
  },
  2: {
    月: { name: "科学技術と現代社会", room: "J29", color: "pink" },
    火: { name: "線形代数", room: "D412", color: "yellow" },
    水: { name: "経済学基礎Ⅰ", room: "J11", color: "beige" },
    木: { name: "会計学基礎（基本簿記と財務諸表の見方）", room: "13", color: "beige" },
    金: { name: "体育実技A（柔道）30（男女共習）", room: "体育館柔道場", color: "green" },
  },
  3: {
    月: { name: "データとの対話S（Python入門）", room: "704", color: "beige" },
    火: null,
    水: null,
    木: null,
    金: { name: "英語翻訳（Ⅰ）", room: "D305", color: "blue" },
  },
  4: {
    月: null,
    火: { name: "英語オーラル・プレゼンテーション（Ⅰ）", room: "D204", color: "yellow" },
    水: { name: "英語リーディングⅠa（中級）", room: "J417", color: "blue" },
    木: null,
    金: { name: "微積分基礎", room: "DB201", color: "blue" },
  },
  5: {
    月: null,
    火: null,
    水: { name: "中国語Ⅰa", room: "307", color: "blue" },
    木: null,
    金: null,
  },
};

const times = {
  1: "9:00\n10:30",
  2: "10:45\n12:15",
  3: "13:00\n14:30",
  4: "14:45\n16:15",
  5: "16:30\n18:00",
};

const timesDisplay = {
  1: "9:00–10:30",
  2: "10:45–12:15",
  3: "13:00–14:30",
  4: "14:45–16:15",
  5: "16:30–18:00",
};

const days = ["月", "火", "水", "木", "金"];
const periods = [1, 2, 3, 4, 5];

// Get today's day in Japanese
const dayMap = [null, "月", "火", "水", "木", "金", "土", "日"];
const todayDay = dayMap[new Date().getDay()];

const container = document.getElementById("timetable");

// Header
const header = document.createElement("div");
header.className = "grid-row";
header.innerHTML = `<div></div>` + days.map(d =>
  `<div class="day-header${d === todayDay ? ' today' : ''}">${d}</div>`
).join("");
container.appendChild(header);

// Rows
periods.forEach(p => {
  const row = document.createElement("div");
  row.className = "grid-row";

  const label = document.createElement("div");
  label.className = "period-label";
  label.innerHTML = `<span class="period-num">${p}</span><span class="period-time">${times[p]}</span>`;
  row.appendChild(label);

  days.forEach(d => {
    const cell = data[p][d];
    const div = document.createElement("div");
    if (cell) {
      div.className = `cell ${cell.color}`;
      div.innerHTML = `<span class="cell-name">${cell.name}</span>`;
      div.onclick = () => openModal(d, p, cell.name, cell.room);
    } else {
      div.className = "cell empty";
    }
    row.appendChild(div);
  });

  container.appendChild(row);
});

function openModal(day, period, name, room) {
  document.getElementById("modal-meta").textContent = `${day}曜日 · ${period}限 · ${timesDisplay[period]}`;
  document.getElementById("modal-name").textContent = name;
  document.getElementById("modal-room").textContent = room;
  document.getElementById("overlay").classList.add("active");
}

function closeModal() {
  document.getElementById("overlay").classList.remove("active");
}
</script>

</body>
</html>
